<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>자료 찾기</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            height: 100vh;
            position: relative;
            font-family: sans-serif;
        }

        /* 입력창 스타일 */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.07);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 250px;
            box-sizing: border-box;
        }

        #stop-input {
            width: 100%;
            padding: 6px 0;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            text-align: center;
            color: #fff;
        }

        #stop-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* [핵심 수정] 줄바꿈이 가능하도록 플렉시블 스타일 적용 */
        .random-text {
            position: absolute;
            font-weight: bold;
            display: inline-block;
            white-space: normal;      /* 한 줄 고정 해제 -> 자동 줄바꿈 허용 */
            word-break: keep-all;     /* 단어 단위로 예쁘게 줄바꿈 */
            max-width: 40vw;          /* 모바일에서도 화면 너비의 최대 40%까지만 차지하도록 제한 */
            user-select: none;
            will-change: transform, opacity;
            line-height: 1.2;
        }

        /* 최종 메시지 */
        #final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6vw;
            font-weight: bold;
            color: #fff;
            text-align: center;
            width: 90%;
            word-break: keep-all;
            user-select: none;
            animation: finalFadeIn 1s ease-out forwards;
        }

        @media (min-width: 768px) {
            #final-message {
                font-size: 3rem;
            }
        }

        @keyframes finalFadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <input type="text" id="stop-input" placeholder="암호를 입력하세요">
    </div>

    <script>
        const textContent = "니얼굴의악마를왜깨웟습니다까";
        const ESCAPE_WORD = "냐냐냥!!";
        let generatorInterval = null;
        const activeTexts = []; 

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function spawnText() {
            const spawnCount = Math.floor(Math.random() * 2) + 2; 

            for (let i = 0; i < spawnCount; i++) {
                const span = document.createElement('span');
                span.className = 'random-text';
                span.innerText = textContent;

                // 반응형 폰트 크기 설정
                const fontSizeVw = (Math.random() * 3) + 3.5; // 3.5vw ~ 6.5vw
                span.style.fontSize = fontSizeVw + 'vw';
                span.style.color = getRandomColor();

                // 우선 바디에 임시 추가하여 줄바꿈이 반영된 실제 크기(width, height) 계산
                document.body.appendChild(span);
                const textWidth = span.offsetWidth;
                const textHeight = span.offsetHeight;

                // 화면 밖으로 나가지 않는 안전한 랜덤 시작 위치 계산
                const startX = Math.random() * (window.innerWidth - textWidth);
                const startY = Math.random() * (window.innerHeight - textHeight - 100) + 50; 

                const textObj = {
                    element: span,
                    width: textWidth,
                    height: textHeight,
                    x: startX,
                    y: startY,
                    vx: (Math.random() - 0.5) * 6, // 튀는 속도를 조금 안정적으로 조절
                    vy: -(Math.random() * 5 + 4),    
                    gravity: 0.35,                   
                    bounce: 0.6,                   
                    opacity: 1,
                    life: 150                       
                };

                span.style.left = '0px';
                span.style.top = '0px';
                span.style.transform = `translate(${textObj.x}px, ${textObj.y}px)`;

                activeTexts.push(textObj);
            }
        }

        function updatePhysics() {
            for (let i = activeTexts.length - 1; i >= 0; i--) {
                const t = activeTexts[i];
                
                t.vy += t.gravity;
                t.x += t.vx;
                t.y += t.vy;

                // 바닥 바운스 (글자 자체의 높이 t.height 반영)
                const floor = window.innerHeight - t.height - 20;
                if (t.y > floor) {
                    t.y = floor;
                    t.vy = -t.vy * t.bounce; 
                    t.vx *= 0.9;             
                }

                // 좌우 벽 바운스 (자동 줄바꿈된 가로 폭 t.width 반영)
                if (t.x < 0) {
                    t.x = 0;
                    t.vx = -t.vx * 0.8;
                } else if (t.x > window.innerWidth - t.width) {
                    t.x = window.innerWidth - t.width;
                    t.vx = -t.vx * 0.8;
                }

                t.life--;
                if (t.life < 50) {
                    t.opacity = t.life / 50;
                }

                t.element.style.transform = `translate(${t.x}px, ${t.y}px)`;
                t.element.style.opacity = t.opacity;

                if (t.life <= 0) {
                    t.element.remove();
                    activeTexts.splice(i, 1);
                }
            }
            
            if (generatorInterval) {
                requestAnimationFrame(updatePhysics);
            }
        }

        function startEffect() {
            spawnText();
            generatorInterval = setInterval(spawnText, 500);
            requestAnimationFrame(updatePhysics);
        }

        function stopEffect() {
            clearInterval(generatorInterval);
            generatorInterval = null; 
            
            activeTexts.forEach(t => t.element.remove());
            activeTexts.length = 0;
            
            document.getElementById('control-panel').remove();

            const finalDiv = document.createElement('div');
            finalDiv.id = 'final-message';
            finalDiv.innerText = '니얼굴의악마는 잠들었습니다 :)';
            document.body.appendChild(finalDiv);
        }

        document.getElementById('stop-input').addEventListener('input', (e) => {
            if (e.target.value === ESCAPE_WORD) {
                stopEffect();
            }
        });

        window.onload = startEffect;
    </script>

</body>
</html>
