<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자료 찾기 사이트</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            height: 100vh;
            position: relative;
            font-family: sans-serif;
        }

        /* 입력창 스타일 */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.07);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #stop-input {
            padding: 6px 12px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            text-align: center;
            color: #fff;
        }

        #stop-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .random-text {
            position: absolute;
            font-weight: bold;
            white-space: nowrap;
            user-select: none;
            will-change: transform, opacity;
        }

        /* [새로 추가] 암호 입력 후 중앙에 뜰 종료 문구 스타일 */
        #final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem; /* 큰 글씨 */
            font-weight: bold;
            color: #fff;
            text-align: center;
            white-space: nowrap;
            user-select: none;
            animation: finalFadeIn 1s ease-out forwards; /* 부드럽게 나타나는 효과 */
        }

        @keyframes finalFadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <input type="text" id="stop-input" placeholder="암호를 입력하세요">
    </div>

    <script>
        const textContent = "니얼굴의악마를왜깨웟습니다까";
        const ESCAPE_WORD = "냐냐냥!!";
        let generatorInterval = null;
        const activeTexts = []; 

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function spawnText() {
            const spawnCount = Math.floor(Math.random() * 2) + 2; 

            for (let i = 0; i < spawnCount; i++) {
                const span = document.createElement('span');
                span.className = 'random-text';
                span.innerText = textContent;

                const fontSize = Math.floor(Math.random() * 24) + 16;
                span.style.fontSize = fontSize + 'px';
                span.style.color = getRandomColor();

                const startX = Math.random() * (window.innerWidth - 200);
                const startY = Math.random() * (window.innerHeight - 100); 

                const textObj = {
                    element: span,
                    x: startX,
                    y: startY,
                    vx: (Math.random() - 0.5) * 10, 
                    vy: -(Math.random() * 8 + 6),    
                    gravity: 0.5,                   
                    bounce: 0.65,                   
                    opacity: 1,
                    life: 140                       
                };

                span.style.left = '0px';
                span.style.top = '0px';
                span.style.transform = `translate(${textObj.x}px, ${textObj.y}px)`;

                document.body.appendChild(span);
                activeTexts.push(textObj);
            }
        }

        function updatePhysics() {
            for (let i = activeTexts.length - 1; i >= 0; i--) {
                const t = activeTexts[i];
                
                t.vy += t.gravity;
                t.x += t.vx;
                t.y += t.vy;

                const floor = window.innerHeight - 50;
                if (t.y > floor) {
                    t.y = floor;
                    t.vy = -t.vy * t.bounce; 
                    t.vx *= 0.9;             
                }

                if (t.x < 0) {
                    t.x = 0;
                    t.vx = -t.vx * 0.8;
                } else if (t.x > window.innerWidth - 220) {
                    t.x = window.innerWidth - 220;
                    t.vx = -t.vx * 0.8;
                }

                t.life--;
                if (t.life < 50) {
                    t.opacity = t.life / 50;
                }

                t.element.style.transform = `translate(${t.x}px, ${t.y}px)`;
                t.element.style.opacity = t.opacity;

                if (t.life <= 0) {
                    t.element.remove();
                    activeTexts.splice(i, 1);
                }
            }
            
            if (generatorInterval) {
                requestAnimationFrame(updatePhysics);
            }
        }

        function startEffect() {
            spawnText();
            generatorInterval = setInterval(spawnText, 500);
            requestAnimationFrame(updatePhysics);
        }

        // 효과 중단 및 최종 메시지 출력 함수
        function stopEffect() {
            clearInterval(generatorInterval);
            generatorInterval = null; 
            
            // 기존 튀어 다니던 텍스트 전부 삭제
            activeTexts.forEach(t => t.element.remove());
            activeTexts.length = 0;
            
            // 입력창 상단 UI 삭제
            document.getElementById('control-panel').remove();

            // [새로 추가] 정중앙 종료 메시지 생성 및 띄우기 (영구 지속)
            const finalDiv = document.createElement('div');
            finalDiv.id = 'final-message';
            finalDiv.innerText = '니얼굴의악마는 잠들었습니다 :)';
            document.body.appendChild(finalDiv);
        }

        document.getElementById('stop-input').addEventListener('input', (e) => {
            if (e.target.value === ESCAPE_WORD) {
                stopEffect();
            }
        });

        window.onload = startEffect;
    </script>

</body>
</html>
