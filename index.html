<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>자료 찾기 사이트</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            height: 100vh;
            position: relative;
            font-family: sans-serif;
        }

        /* 입력창 스타일 */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.07);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 250px;
            box-sizing: border-box;
        }

        #stop-input {
            width: 100%;
            padding: 6px 0;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            text-align: center;
            color: #fff;
        }

        #stop-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .random-text {
            position: absolute;
            font-weight: bold;
            white-space: nowrap;
            user-select: none;
            will-change: transform, opacity;
        }

        /* 최종 메시지 모바일 대응 최적화 */
        #final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6vw; /* 화면 크기에 반응 (PC에서는 max-size 제어) */
            font-weight: bold;
            color: #fff;
            text-align: center;
            width: 90%;
            word-break: keep-all; /* 단어 단위 줄바꿈 */
            user-select: none;
            animation: finalFadeIn 1s ease-out forwards;
        }

        /* PC 화면에서는 너무 커지지 않도록 한계 설정 */
        @media (min-width: 768px) {
            #final-message {
                font-size: 3rem;
            }
        }

        @keyframes finalFadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <input type="text" id="stop-input" placeholder="암호를 입력하세요">
    </div>

    <script>
        const textContent = "니얼굴의악마를왜깨웟습니다까";
        const ESCAPE_WORD = "냐냐냥!!";
        let generatorInterval = null;
        const activeTexts = []; 

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function spawnText() {
            const spawnCount = Math.floor(Math.random() * 2) + 2; 

            for (let i = 0; i < spawnCount; i++) {
                const span = document.createElement('span');
                span.className = 'random-text';
                span.innerText = textContent;

                // [모바일 대응] 글자 크기를 화면 폭에 비례하는 vw 단위로 랜덤 지정 (3vw ~ 7vw)
                const fontSizeVw = (Math.random() * 4) + 3;
                span.style.fontSize = fontSizeVw + 'vw';
                span.style.color = getRandomColor();

                // 화면에 임시 배치 후 실제 렌더링된 너비(px) 계산 (벽 충돌 방지용)
                document.body.appendChild(span);
                const textWidth = span.offsetWidth;

                const startX = Math.random() * (window.innerWidth - textWidth);
                const startY = Math.random() * (window.innerHeight - 100); 

                const textObj = {
                    element: span,
                    width: textWidth, // 텍스트 실제 가로 길이 저장
                    x: startX,
                    y: startY,
                    vx: (Math.random() - 0.5) * 8, 
                    vy: -(Math.random() * 6 + 4),    
                    gravity: 0.4,                   
                    bounce: 0.6,                   
                    opacity: 1,
                    life: 140                       
                };

                span.style.left = '0px';
                span.style.top = '0px';
                span.style.transform = `translate(${textObj.x}px, ${textObj.y}px)`;

                activeTexts.push(textObj);
            }
        }

        function updatePhysics() {
            for (let i = activeTexts.length - 1; i >= 0; i--) {
                const t = activeTexts[i];
                
                t.vy += t.gravity;
                t.x += t.vx;
                t.y += t.vy;

                const floor = window.innerHeight - 40;
                if (t.y > floor) {
                    t.y = floor;
                    t.vy = -t.vy * t.bounce; 
                    t.vx *= 0.9;             
                }

                // [가변 벽 충돌] 저장해둔 각 글자 폭(t.width)을 기준으로 튕김 처리
                if (t.x < 0) {
                    t.x = 0;
                    t.vx = -t.vx * 0.8;
                } else if (t.x > window.innerWidth - t.width) {
                    t.x = window.innerWidth - t.width;
                    t.vx = -t.vx * 0.8;
                }

                t.life--;
                if (t.life < 50) {
                    t.opacity = t.life / 50;
                }

                t.element.style.transform = `translate(${t.x}px, ${t.y}px)`;
                t.element.style.opacity = t.opacity;

                if (t.life <= 0) {
                    t.element.remove();
                    activeTexts.splice(i, 1);
                }
            }
            
            if (generatorInterval) {
                requestAnimationFrame(updatePhysics);
            }
        }

        function startEffect() {
            spawnText();
            generatorInterval = setInterval(spawnText, 500);
            requestAnimationFrame(updatePhysics);
        }

        function stopEffect() {
            clearInterval(generatorInterval);
            generatorInterval = null; 
            
            activeTexts.forEach(t => t.element.remove());
            activeTexts.length = 0;
            
            document.getElementById('control-panel').remove();

            const finalDiv = document.createElement('div');
            finalDiv.id = 'final-message';
            finalDiv.innerText = '니얼굴의악마는 잠들었습니다 :)';
            document.body.appendChild(finalDiv);
        }

        document.getElementById('stop-input').addEventListener('input', (e) => {
            if (e.target.value === ESCAPE_WORD) {
                stopEffect();
            }
        });

        window.onload = startEffect;
    </script>

</body>
</html>
