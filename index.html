<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>자료 찾기</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            height: 100vh;
            position: relative;
            font-family: sans-serif;
        }

        /* 입력창 스타일 */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.07);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 80%;
            max-width: 250px;
            box-sizing: border-box;
        }

        #stop-input {
            width: 100%;
            padding: 6px 0;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            text-align: center;
            color: #fff;
        }

        #stop-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* [수정 포인트] 모바일에서 무한 증식 및 짤림 방지 */
        .random-text {
            position: absolute;
            font-weight: bold;
            display: inline-block;
            white-space: normal;      /* 줄바꿈 허용 */
            
            /* 핵심 해결책: 공백이 없어도 글자 단위로 무조건 강제 줄바꿈 */
            word-break: break-all;     
            
            /* 모바일 화면을 넘어가지 않도록 최대 너비를 타이트하게 제한 (화면 폭의 최대 50%) */
            max-width: 50vw;          
            
            user-select: none;
            will-change: transform, opacity;
            line-height: 1.2;
        }

        /* 최종 메시지 */
        #final-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6vw;
            font-weight: bold;
            color: #fff;
            text-align: center;
            width: 90%;
            word-break: keep-all;
            user-select: none;
            animation: finalFadeIn 1s ease-out forwards;
        }

        @media (min-width: 768px) {
            #final-message {
                font-size: 3rem;
            }
        }

        @keyframes finalFadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div id="control-panel">
        <input type="text" id="stop-input" placeholder="암호를 입력하세요">
    </div>

    <script>
        const textContent = "당신의엉덩이를뉴질랜드로가져오십시오";
        const ESCAPE_WORD = "엉덩이";
        let generatorInterval = null;
        const activeTexts = []; 

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        function spawnText() {
            const spawnCount = Math.floor(Math.random() * 2) + 2; 

            for (let i = 0; i < spawnCount; i++) {
                const span = document.createElement('span');
                span.className = 'random-text';
                span.innerText = textContent;

                // 모바일 가독성을 위해 글자 크기 밸런스 조정 (4vw ~ 7vw)
                const fontSizeVw = (Math.random() * 3) + 4; 
                span.style.fontSize = fontSizeVw + 'vw';
                span.style.color = getRandomColor();

                document.body.appendChild(span);
                
                // 줄바꿈이 완벽히 적용된 후의 실제 렌더링 너비와 높이 측정
                const textWidth = span.offsetWidth;
                const textHeight = span.offsetHeight;

                // 벽 바깥으로 아예 나가지 못하도록 마진 확보 후 랜덤 배치
                const startX = Math.random() * (window.innerWidth - textWidth);
                const startY = Math.random() * (window.innerHeight - textHeight - 120) + 40; 

                const textObj = {
                    element: span,
                    width: textWidth,
                    height: textHeight,
                    x: startX,
                    y: startY,
                    vx: (Math.random() - 0.5) * 5, 
                    vy: -(Math.random() * 4 + 4),    
                    gravity: 0.3,                   
                    bounce: 0.55,                   
                    opacity: 1,
                    life: 160                       
                };

                span.style.left = '0px';
                span.style.top = '0px';
                span.style.transform = `translate(${textObj.x}px, ${textObj.y}px)`;

                activeTexts.push(textObj);
            }
        }

        function updatePhysics() {
            for (let i = activeTexts.length - 1; i >= 0; i--) {
                const t = activeTexts[i];
                
                t.vy += t.gravity;
                t.x += t.vx;
                t.y += t.vy;

                // 바닥 바운스 안전장치
                const floor = window.innerHeight - t.height - 20;
                if (t.y > floor) {
                    t.y = floor;
                    t.vy = -t.vy * t.bounce; 
                    t.vx *= 0.85;             
                }

                // 좌우 벽 바운스 안전장치 (화면 크기 가변 대응)
                if (t.x < 0) {
                    t.x = 0;
                    t.vx = -t.vx * 0.7;
                } else if (t.x > window.innerWidth - t.width) {
                    t.x = window.innerWidth - t.width;
                    t.vx = -t.vx * 0.7;
                }

                t.life--;
                if (t.life < 50) {
                    t.opacity = t.life / 50;
                }

                t.element.style.transform = `translate(${t.x}px, ${t.y}px)`;
                t.element.style.opacity = t.opacity;

                if (t.life <= 0) {
                    t.element.remove();
                    activeTexts.splice(i, 1);
                }
            }
            
            if (generatorInterval) {
                requestAnimationFrame(updatePhysics);
            }
        }

        function startEffect() {
            spawnText();
            generatorInterval = setInterval(spawnText, 500);
            requestAnimationFrame(updatePhysics);
        }

        function stopEffect() {
            clearInterval(generatorInterval);
            generatorInterval = null; 
            
            activeTexts.forEach(t => t.element.remove());
            activeTexts.length = 0;
            
            document.getElementById('control-panel').remove();

            const finalDiv = document.createElement('div');
            finalDiv.id = 'final-message';
            finalDiv.innerText = '뉴질랜드가 당신의 엉덩이를 받고 기뻐합니다 :)';
            document.body.appendChild(finalDiv);
        }

        document.getElementById('stop-input').addEventListener('input', (e) => {
            if (e.target.value === ESCAPE_WORD) {
                stopEffect();
            }
        });

        window.onload = startEffect;
    </script>

</body>
</html>
